{% extends 'base.html' %}
{% block content %}
	<h1 class="mb-3">{{ 'Edit Expense' if expense else 'Add Expense' }}</h1>
	<form method="post" class="card p-3">
		<div class="row g-3">
			<div class="col-sm-4">
				<label class="form-label">Date</label>
				<input name="date" type="date" class="form-control" value="{{ expense.date if expense else '' }}" required />
			</div>
			<div class="col-sm-4">
				<label class="form-label">Category</label>
				<input name="category" class="form-control" value="{{ expense.category if expense else '' }}" required />
			</div>
			<div class="col-sm-4">
				<label class="form-label">Amount</label>
				<input name="amount" type="number" step="0.01" min="0.01" class="form-control" value="{{ expense.amount if expense else '' }}" required />
			</div>
			<div class="col-12">
				<label class="form-label">Description</label>
				<textarea name="description" class="form-control" rows="2">{{ expense.description if expense else '' }}</textarea>
			</div>
		</div>
		<div class="mt-3">
			<button class="btn btn-primary" type="submit">{{ 'Save Changes' if expense else 'Add Expense' }}</button>
			<a class="btn btn-secondary" href="{{ url_for('dashboard') }}">Cancel</a>
		</div>
	</form>
{% endblock %}
